plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.verusmobile.veruscrypto'
version = '0.7.0'

android {
  namespace "com.verusmobile.veruscrypto"
  defaultConfig {
    versionCode 1
    versionName "0.7.0"
  }
}

dependencies {
  /*
   * Not published to JitPack or Maven Central. The consuming app must serve
   * these from a vendored Maven repo built from
   * VerusCoin/verus-android-wallet-sdk@f725d03c, and pin
   * com.github.VerusCoin:verus-android-backend to the 16 KB build
   * 2.1.2-16k.1. See README.md.
   */
  implementation 'com.github.VerusCoin:verus-android-sdk:2.1.2'
}
